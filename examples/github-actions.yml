# Example: run the tracker daily on GitHub Actions and commit the SQLite file back to the repo.
# Copy to .github/workflows/track-prices.yml in your own (private) copy of this repo and add
# CRAWLERDATA_API_KEY under Settings -> Secrets and variables -> Actions.
# Remove "*.db" from .gitignore in your copy so prices.db can be committed.
name: Track Google Shopping prices
on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tracker.py check
        env:
          CRAWLERDATA_API_KEY: ${{ secrets.CRAWLERDATA_API_KEY }}
      - run: python tracker.py chart -o price_chart.html
      - run: |
          git config user.name "price-tracker"
          git config user.email "price-tracker@users.noreply.github.com"
          git add prices.db price_chart.html
          git commit -m "Price check $(date -u +%F)" || echo "nothing to commit"
          git push
